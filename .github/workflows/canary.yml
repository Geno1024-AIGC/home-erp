name: Canary build & release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canary
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Neutralise machine-specific Gradle properties
        run: |
          sed -i '/^org\.gradle\.java\.home=/d;/^org\.gradle\.java\.installations\.paths=/d' gradle.properties

      - name: Build everything
        run: ./gradlew build :star:distZip :swrepo:db:smoke --stacktrace

      - name: Publish canary pre-release (keep only the latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="0.1.$GITHUB_RUN_NUMBER.$(cat android/count.pack 2>/dev/null || echo 0).$(git rev-parse --short=8 HEAD)"
          echo "canary version = $VERSION"
          gh release list --json tagName,isPrerelease --limit 100 --jq '.[] | select(.isPrerelease) | .tagName' > /tmp/old-tags.txt || true
          while read -r t; do
            [ -n "$t" ] && gh release delete "$t" --yes --cleanup-tag || true
          done < /tmp/old-tags.txt
          gh release create "v$VERSION" --prerelease --title "Canary v$VERSION" \
            --notes "Automated Canary build from commit \`$(git rev-parse --short=8 HEAD)\`." \
            star/build/distributions/*.zip android/build/outputs/apk/debug/*.apk android/build/outputs/apk/release/*.apk