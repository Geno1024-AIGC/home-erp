name: Canary build & release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canary
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Neutralise machine-specific Gradle properties
        run: |
          sed -i '/^org\.gradle\.java\.home=/d;/^org\.gradle\.java\.installations\.paths=/d' gradle.properties

      - name: Resolve canary version
        run: echo "CANARY_PACK=$(cat satellite/android/count.pack 2>/dev/null || echo 0)" >> "$GITHUB_ENV"

      - name: Materialise Android signing keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::org secret KEYSTORE_BASE64 is missing or not visible to this repository"
            exit 1
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          if [ ! -s "$RUNNER_TEMP/keystore.jks" ]; then
            echo "::error::KEYSTORE_BASE64 did not decode into a non-empty keystore"
            exit 1
          fi

      - name: Build everything
        run: ./gradlew build :star:distZip :planet:distZip :swrepo:db:smoke :swrepo:relay:smoke :swrepo:topology:smoke :swrepo:gef:smoke :gefs:pack --stacktrace
        env:
          KEYSTORE_STORE_FILE: ${{ runner.temp }}/keystore.jks
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}

      - name: Verify release APK is signed
        run: |
          APK=$(ls satellite/android/build/outputs/apk/release/*.apk 2>/dev/null || true)
          if [ -z "$APK" ]; then
            echo "::error::no release APK was produced"
            exit 1
          fi
          case "$APK" in
            *-unsigned.apk) echo "::error::release APK came out unsigned — signing wiring is broken"; exit 1 ;;
          esac
          echo "signed release APK: $APK"

      - name: Publish canary pre-release (keep only the latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="0.1.$GITHUB_RUN_NUMBER.$CANARY_PACK.$(git rev-parse --short=8 HEAD)"
          echo "canary version = $VERSION"
          gh release list --json tagName,isPrerelease --limit 100 --jq '.[] | select(.isPrerelease) | .tagName' > /tmp/old-tags.txt || true
          while read -r t; do
            [ -n "$t" ] && gh release delete "$t" --yes --cleanup-tag || true
          done < /tmp/old-tags.txt
          gh release create "v$VERSION" --prerelease --title "Canary v$VERSION" \
            --notes "Automated Canary build from commit \`$(git rev-parse --short=8 HEAD)\` — Star + Planet distros, APK and GEF feature packages." \
            star/build/distributions/*.zip planet/build/distributions/*.zip satellite/android/build/outputs/apk/debug/*.apk satellite/android/build/outputs/apk/release/*.apk gefs/build/gefs/*.gef